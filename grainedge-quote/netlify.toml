[build]
  command = "npm run build:all"
  publish = "dist"

[functions]
  directory = "grainedge-quote/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@sparticuz/chromium-min"]

# --- Redirects (order matters: specific first, catch-all last) ---

# API routes → serverless functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Quote preview → serve-quote function (slug passed as query param)
[[redirects]]
  from = "/q/:slug"
  to = "/.netlify/functions/serve-quote?slug=:slug"
  status = 200

# SPA routes — only known React Router paths rewrite to index.html
[[redirects]]
  from = "/success/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Custom 404 — all other unknown URLs get a proper 404 page
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
